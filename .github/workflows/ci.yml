name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest --cov=main --cov-report=term-missing --cov-fail-under=90

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t ai-service-base .
      - run: docker run -d --name app -p 8000:8000 ai-service-base
      - run: curl --fail --retry 15 --retry-all-errors --retry-delay 1 http://localhost:8000/health
      - if: failure()
        run: docker logs app